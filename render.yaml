services:
  # 1. Express & Firebase Node.js Backend API
  - type: web
    name: ecovision-backend-node
    env: node
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000

  # 2. Python FastAPI AI Waste Classifier Service
  - type: web
    name: ecovision-backend-python
    env: python
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT

  # 3. React Frontend Static Web Application
  - type: web
    name: ecovision-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
