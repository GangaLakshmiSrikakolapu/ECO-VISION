services:
  # 1. Express & Firebase Node.js Backend API
  - type: web
    name: ecovision-backend-node
    env: node
    plan: free
    rootDir: backend-node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health

  # 2. Python FastAPI AI Waste Classifier Service
  - type: web
    name: ecovision-backend-python
    env: python
    plan: free
    rootDir: backend-python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 3. React Frontend Static Web Application
  - type: web
    name: ecovision-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_NODE_API_URL
        value: https://ecovision-backend-node.onrender.com/api
      - key: VITE_PYTHON_API_URL
        value: https://ecovision-backend-python.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
